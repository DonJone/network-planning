name: Build & Release Rulesets

on:
  schedule:
    - cron: "0 3 * * *"  # 每天 UTC 03:00 (北京时间 11:00) 自动触发构建
  workflow_dispatch:      # 支持手动触发
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            gins-rules/infra/aggregator/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'gins-rules/infra/aggregator/Cargo.lock') }}

      - name: Build network-planning
        run: cargo build --release --locked

      - name: Sync Gins-Rules Upstream Sources
        working-directory: gins-rules
        run: |
          cargo run --manifest-path infra/aggregator/Cargo.toml --release -- sync
          cargo run --manifest-path infra/aggregator/Cargo.toml --release -- normalize

      - name: Sync Gins-Rules CDN Snapshot
        run: ./target/release/network-planning sync-cdn

      - name: Commit Synced Gins-Rules Sources
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gins-rules/source/ gins-rules/cdn/
          if ! git diff --cached --quiet; then
            git commit -m "chore(gins-rules): auto sync upstream sources and CDN snapshot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Fetch and Generate Rule Sources
        run: ./target/release/network-planning build

      - name: Install Compilers (Mihomo & Sing-box)
        run: |
          mkdir -p bin /tmp/singbox
          # 下载 Mihomo Linux x86_64
          curl -sL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.3/mihomo-linux-amd64-v1.19.3.gz | gzip -d > bin/mihomo
          chmod +x bin/mihomo

          # 下载 Sing-box Linux x86_64
          curl -sL https://github.com/SagerNet/sing-box/releases/download/v1.15.0-alpha.13/sing-box-1.15.0-alpha.13-linux-amd64.tar.gz | tar -xz -C /tmp/singbox
          mv /tmp/singbox/*/sing-box bin/sing-box
          chmod +x bin/sing-box
          rm -rf /tmp/singbox

      - name: Compile Binary Rules (.mrs & .srs)
        run: ./target/release/network-planning compile

      - name: Upload Rulesets Artifact (non-main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rulesets
          path: rules/

      - name: Deploy to Release Branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 提交生成的规则集到 release 分支
          git checkout -B release
          git add -f rules/
          git commit -m "Auto-build rulesets: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push -f origin release
